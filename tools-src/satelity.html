<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satelita - Kierunki</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #f0f2f5; 
            color: #2c3e50; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        
        /* NOWY, ELEGANCKI NAGŁÓWEK */
        header { 
            
            padding: 0 16px; 
            display: flex; 
            align-items: center; 
            height: 56px;
      
            position: relative; 
            z-index: 1000; 
        }
        
       

        h1 { 
            font-size: 1.1rem; 
            margin: 0; 
            position: absolute; 
            left: 0; 
            right: 0; 
            text-align: center; 
            pointer-events: none; 
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        #map { 
            height: 40%; 
            width: 100%; 
            z-index: 1; 
            border-bottom: 2px solid rgba(0,0,0,0.08); 
        }
        
        .list-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 12px; 
            box-sizing: border-box;
        }
        
        .sat-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .sat-card:active {
            transform: scale(0.98);
        }

        .sat-card.active { 
            border: 2px solid #00c853; 
            background: #f1f8e9; 
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.15);
        }

        .sat-info { 
            display: flex; 
            flex-direction: column; 
        }
        
        .sat-name { 
            font-weight: 700; 
            font-size: 1.05rem; 
            color: #004ba0; 
            margin-bottom: 2px;
        }
        
        .sat-pos { 
            font-size: 0.8rem; 
            color: #656d76; 
        }
        
        .sat-angles { 
            margin-top: 6px; 
            font-weight: 700; 
            color: #333; 
            font-size: 0.9rem;
        }

        .btn-line { 
            background: #004ba0; 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-line:active {
            background: #00c853; 
            transform: scale(0.95);
        }

        /* Dyskretny podpis na mapie */
        .leaflet-control-attribution {
            font-size: 8px !important; 
            background: rgba(255, 255, 255, 0.6) !important; 
            max-width: 60%; 
            border-top-left-radius: 4px;
        }
    </style>
</head>
<body onload="initMap()">

<header>

    <h1>Kierunki Satelit</h1>
</header>

<div id="map"></div>

<div class="list-container" id="satList">
    <div style="padding: 30px; text-align: center; color: #666; font-size: 0.95rem;">
        ⏳ Pobieram pozycję GPS...
    </div>
</div>

<script>
    let map, userMarker, currentLine;
    let userCoords = null;

    const satellites = [
        { name: "Hotbird 13°E", lon: 13.0 },
        { name: "Astra 19.2°E", lon: 19.2 },
        { name: "Astra 23.5°E", lon: 23.5 },
        { name: "Thor 0.8°W", lon: -0.8 },
        { name: "Hispasat 30°W", lon: -30.0 }
    ];

    function initMap() {
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri Satellite'
        });

        map = L.map('map', {
            center: [52.23, 21.01],
            zoom: 6,
            layers: [satellite], // Domyślnie satelita
            zoomControl: false
        });

        const baseMaps = {
            "Satelita": satellite,
            "Mapa": osm
        };
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                userCoords = [position.coords.latitude, position.coords.longitude];
                
                map.setView(userCoords, 17);
                
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.circleMarker(userCoords, {
                    color: '#ffffff',
                    fillColor: '#004ba0',
                    fillOpacity: 1,
                    weight: 3,
                    radius: 9
                }).addTo(map).bindPopup("Twoja pozycja");
                
                displaySatellites();
            }, () => {
                document.getElementById('satList').innerHTML = "<p style='text-align:center; padding:20px; color:#d93025; font-weight:bold;'>Błąd GPS. Włącz lokalizację w telefonie.</p>";
            }, { enableHighAccuracy: true });
        }
    }

    function displaySatellites() {
        const list = document.getElementById('satList');
        list.innerHTML = "";

        satellites.forEach(sat => {
            const az = calculateAzimuth(userCoords[0], userCoords[1], sat.lon);
            const el = calculateElevation(userCoords[0], userCoords[1], sat.lon);
            
            const card = document.createElement('div');
            card.className = 'sat-card';
            card.innerHTML = `
                <div class="sat-info">
                    <span class="sat-name">${sat.name}</span>
                    <span class="sat-pos">Pozycja: ${sat.lon}°</span>
                    <span class="sat-angles">Azymut: ${az}° | Elewacja: ${el}°</span>
                </div>
                <button class="btn-line" onclick="drawLine(${az}, this)">WYBIERZ</button>
            `;
            list.appendChild(card);
        });
    }

    function drawLine(az, btn) {
        if (!userCoords) return;

        document.querySelectorAll('.sat-card').forEach(c => c.classList.remove('active'));
        btn.closest('.sat-card').classList.add('active');

        if (currentLine) map.removeLayer(currentLine);

        const angleRad = (az - 90) * Math.PI / 180;
        const d = 0.005; 
        const endPoint = [
            userCoords[0] - d * Math.sin(angleRad), 
            userCoords[1] + d * Math.cos(angleRad)
        ];

        currentLine = L.polyline([userCoords, endPoint], { 
            color: '#00c853', 
            weight: 6, 
            dashArray: '8, 8' 
        }).addTo(map);

        map.setView(userCoords, 17, { animate: true });
    }

    // Obliczenia trygonometryczne
    function calculateAzimuth(lat, lon, satLon) {
        const phi = lat * Math.PI / 180;
        const dL = (lon - satLon) * Math.PI / 180;
        const az = Math.PI + Math.atan2(Math.tan(dL), Math.sin(phi));
        return Math.round((az * 180 / Math.PI) % 360);
    }

    function calculateElevation(lat, lon, satLon) {
        const phi = lat * Math.PI / 180;
        const dL = (lon - satLon) * Math.PI / 180;
        const R = 6371; 
        const r = 42164; 
        const num = Math.cos(phi) * Math.cos(dL) - (R/r);
        const den = Math.sqrt(1 - Math.pow(Math.cos(phi) * Math.cos(dL), 2));
        const el = Math.atan2(num, den);
        return Math.round(el * 180 / Math.PI);
    }
</script>

</body>
</html>
