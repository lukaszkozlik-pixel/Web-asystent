<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteka SAT</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            background: #f0f2f5; 
            color: #2c3e50; 
        }
        
        /* NOWY, ELEGANCKI NAGŁÓWEK */
        header { 
           
            padding: 0 16px; 
            display: flex; 
            align-items: center; 
            height: 56px;
            position: relative; 
            z-index: 1000; 
        }
        
       
        h1 { 
            font-size: 1.1rem; 
            margin: 0; 
            position: absolute; 
            left: 0; 
            right: 0; 
            text-align: center; 
            pointer-events: none; 
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .container { 
            padding: 12px; 
            max-width: 480px;
            margin: 0 auto;
        }
        
        .accordion { 
            background: #ffffff; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            overflow: hidden; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
        }
        
        .acc-header { 
            background: #004ba0; 
            color: white; 
            padding: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .acc-header:active {
            background: #003d82;
        }
        
        .acc-content { 
            display: none; 
            padding: 0; 
            border-top: 1px solid #eee; 
            background: #fff; 
            color: #333; 
            height: 65vh; 
        }
        
        .acc-content.show { 
            display: block; 
        }
        
        .acc-content iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
        }
    </style>
</head>
<body>

<header>
    
    <h1>Biblioteka SAT</h1>
</header>

<div class="container">
    <div class="accordion">
        <div class="acc-header" onclick="toggleAcc(this)">Parametry SAT <span>+</span></div>
        <div class="acc-content">
           <iframe class="content-frame" src="docs/ParametrySAT.html"></iframe>
        </div>
    </div>
    
    <div class="accordion">
        <div class="acc-header" onclick="toggleAcc(this)">KOLORY KABLI (QUATTRO) <span>+</span></div>
        <div class="acc-content">
            <iframe class="content-frame" src="docs/kolorySat.html"></iframe>
        </div>
    </div>

    <div class="accordion">
        <div class="acc-header" onclick="toggleAcc(this)">UNICABLE (USER BANDS) <span>+</span></div>
        <div class="acc-content">
           <iframe class="content-frame" src="docs/UnicablePB.html"></iframe>
        </div>
    </div>

    <div class="accordion">
        <div class="acc-header" onclick="window.location.href='docs/KonstelacjaSat.html'"><span>KONSTELACJA SAT</span><span>▶</span></div>
    </div>

    <div class="accordion">
        <div class="acc-header" onclick="toggleAcc(this)">Ultrabox i Dualbox reset <span>+</span></div>
        <div class="acc-content">
           <iframe class="content-frame" src="docs/NC_PLUS_RESET.html"></iframe>
        </div>
    </div>
</div>

<script>
function toggleAcc(header) {
    const content = header.nextElementSibling;
    if (!content || !content.classList.contains('acc-content')) return;
    const span = header.querySelector('span');
    
    const allHeaders = document.querySelectorAll('.acc-header');
    allHeaders.forEach(h => {
        const c = h.nextElementSibling;
        const s = h.querySelector('span');
        if (c && c.classList.contains('acc-content')) {
            c.classList.remove('show');
            if (s) s.innerText = '+';
        }
    });
    
    const isOpening = !content.classList.contains('show');
    if (isOpening) {
        content.classList.add('show');
        if (span) span.innerText = '−';
    }
}
</script>
</body>
</html>
