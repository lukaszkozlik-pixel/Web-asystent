<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Web-Asystent</title>
    <meta name="version" content="3.3.2">
    <meta name="build-date" content="2026-11-23">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Górny pasek nawigacji z zakładkami -->
    <div id="glowne-menu-zakladek" class="top-nav">
        <button id="tab-narzedzia" onclick="zmienZakladka('narzedzia')">🧰 Narzędzia</button>
        <button id="tab-kalendarz" class="active-tab" onclick="zmienZakladka('kalendarz')">📅 Kalendarz</button>
        <button id="tab-dziennik" onclick="zmienZakladka('dziennik')">📋 Dziennik</button>
        <button id="tab-notatki" onclick="zmienZakladka('notatki')">📝 Notatki</button>
    </div>

    <!-- WIDOK 0: KAFLE NARZĘDZI TECHNICZNYCH -->
    <div id="widok-narzedzia" class="view">
        <div class="tile-grid">
            <div class="tile" onclick="location.href='tools-src/dvbt.html'">
                <span class="icon">🗼</span>
                <span class="label">TV Naziemna DVBT-2</span>
            </div>

            <div class="tile" onclick="location.href='tools-src/sat.html'">
                <span class="icon">📡</span>
                <span class="label">TV Satelitarna</span>
            </div>

            <div class="tile" onclick="location.href='tools-src/monitoring.html'">
                <span class="icon">📹</span>
                <span class="label">Monitoring CCTV</span>
            </div>

            <div class="tile" onclick="location.href='tools-src/internet.html'">
                <span class="icon">🌐</span>
                <span class="label">Internet i LTE</span>
            </div>

            <div class="tile" onclick="location.href='tools-src/bts.html'">
                <span class="icon">📶</span>
                <span class="label">Mapa BTS</span>
            </div>

        </div>
    </div>

    <!-- WIDOK 1: KALENDARZ / WIZYTY -->
    <div id="widok-kalendarza" class="view active">
        <div class="card" style="padding: 10px;">
            <div class="cal-header-nav">
                <button id="cal-btn-prev" onclick="zmienMiesiac(-1)" style="display:none;">❮</button>
                <h3 id="cal-month-title" style="margin: 0; font-size: 1rem; flex: 1; text-align: center;">Miesiąc Roku</h3>
                <button id="cal-btn-next" onclick="zmienMiesiac(1)" style="display:none;">❯</button>
            </div>
            <div class="cal-grid" id="calendar-grid"></div>
            <button class="btn-toggle-cal" id="btn-toggle-cal" onclick="toggleKalendarzTryb()">▼ Rozwiń pełny miesiąc</button>
        </div>

        <div class="card day-schedule-card">
            <div class="day-top-bar">
                <h3 id="selected-day-title" style="margin: 0; font-size: 1rem; font-weight: bold;">Wizyty w dniu</h3>
                <div class="day-top-actions">
                    <button type="button" id="btn-toggle-search" class="btn-search-toggle" onclick="przelaczWyszukiwarke()" title="Szukaj w wizytach i notatkach">🔍</button>
                    <button type="button" onclick="otworzFormularzWizytyDlaWybranegoDnia()" style="background: #e67e22; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">＋ Dodaj</button>
                </div>
            </div>

            <!-- Ukrywana pod lupką wyszukiwarka wizyt i notatek -->
            <div id="day-search-drawer" class="day-search-drawer" style="display: none;">
                <div class="search-input-wrap">
                    <input type="search" id="global-search-input" class="search-input"
                           placeholder="Szukaj w wizytach i notatkach (adres, tel, treść)..."
                           oninput="wykonajWyszukiwanie(this.value)">
                    <button type="button" class="search-clear-btn"
                            onclick="wyczyscIZamknijWyszukiwarke()" title="Wyczyść i zamknij">✕</button>
                </div>
                <div id="global-search-results" class="search-results-panel" style="display: none;"></div>
            </div>

            <!-- Nieruchomy pasek wizyt całodniowych na samej górze widoku dnia -->
            <div id="wizyty-calodniowe-sticky" class="allday-sticky-zone"></div>

            <!-- Przewijany obszar godzin 07:00 - 19:00 (oraz ewentualne wcześniejsze/późniejsze) -->
            <div id="lista-wizyt-dnia" class="day-timeline-scroll"></div>

           <div class="backup-panel-toggle" onclick="toggleBackupMenu()">⚙️ Kopia zapasowa / Przywracanie danych</div>
            <div class="backup-actions" id="backup-actions-container">
                <button class="btn-backup" onclick="podlaczFolderSyncthing()">🔗 Połącz z folderem Syncthing</button>
                <button class="btn-backup" onclick="zapiszKopieBazy()">💾 Pobierz kopię zapasową (JSON)</button>
                <button class="btn-restore" onclick="triggerRestore()">📂 Przywróć dane z pliku</button>
                <button class="btn-ics" onclick="triggerICSImport()">📥 Importuj wizyty z pliku (.ics)</button>
                <input type="file" id="restore-file-input" style="display: none;" accept=".json" onchange="przywracajBaze(event)">
                <input type="file" id="ics-file-input" style="display: none;" accept=".ics,text/calendar" onchange="importujZPlikuICS(event)">
            </div>

        </div>
    </div>

    <!-- WIDOK 2: DZIENNIK PRAC -->
    <div id="widok-dziennika" class="view">
        <button class="btn-add-main" style="background-color: #2ecc71;" onclick="otworzFormularzWpisu()">＋ Dodaj nowy wpis</button>
        <button class="btn-secondary" style="background-color: #2980b9; margin-bottom: 15px;" onclick="eksportujWszystkieWpisyDoSyncthing()">📂 Eksportuj wszystkie</button>
        <div class="card">
            <h3>Lista zdarzeń</h3>
            <div id="lista-zdarzen"></div>
        </div>
    </div>

    <!-- WIDOK 3: NOTATKI -->
    <div id="widok-notatek" class="view">
        <button class="btn-add-main" style="background-color: #3498db;" onclick="otworzFormularzNotatki()">＋ Dodaj nową notatkę</button>
        <div class="card">
            <h3>Twoje notatki</h3>
            <div id="lista-notatek"></div>
        </div>
    </div>

    <!-- FORMULARZ WIZYTY -->
    <div id="widok-formularza-wizyty" class="view card">
        <h2 id="visit-form-title">Nowa wizyta</h2>
        <input type="hidden" id="edit-visit-index" value="-1">

        <label>Typ wpisu:</label>
        <select id="visit-type">
            <option value="sluzbowy">Służbowy</option>
            <option value="prywatny">Prywatny</option>
        </select>

        <label>Data wizyty:</label>
        <input type="date" id="visit-date">

        <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="visit-all-day" style="width: 20px; height: 20px;" onchange="toggleCałyDzień()">
            <label for="visit-all-day" style="margin: 0; cursor: pointer;">Cały dzień</label>
        </div>

        <div id="container-godzina">
            <label>Godzina:</label>
            <input type="time" id="visit-time">
        </div>

        <label>Telefon:</label>
        <input type="text" id="visit-client" placeholder="Numer telefonu lub imię...">

        <label>Adres:</label>
        <input type="text" id="visit-address" placeholder="Adres spotkania...">

        <label>Opis / Zakres prac:</label>
        <textarea id="visit-desc" rows="4" placeholder="Szczegóły wizyty..."></textarea>

        <button class="btn-primary" style="background-color: #e67e22;" onclick="zapiszWizyte()">Zapisz wizytę</button>
        <button class="btn-secondary" onclick="zamknijFormularzWizyty()">Anuluj</button>
    </div>

    <!-- FORMULARZ WPISU KSIĘGOWEGO -->
    <div id="widok-formularza" class="view card">
        <h2 id="form-title">Nowy wpis</h2>
        <input type="hidden" id="edit-index" value="-1">

        <label>Data wpisu:</label>
        <input type="date" id="data">

        <label>Adres:</label>
        <input type="text" id="adres">

        <label>Przychód:</label>
        <input type="text" id="przychod" value="0,00" inputmode="decimal" placeholder="0,00">

        <label>Koszt:</label>
        <input type="text" id="koszt" value="0,00" inputmode="decimal" placeholder="0,00">

        <label>Formatowanie:</label>
        <div class="toolbar">
            <button type="button" onmousedown="event.preventDefault()" onclick="formatText('bold')">B</button>
            <button type="button" onmousedown="event.preventDefault()" onclick="formatText('italic')">I</button>
            <button type="button" onmousedown="event.preventDefault()" onclick="formatText('underline')">U</button>
            <button type="button" class="btn-clear-format" onmousedown="event.preventDefault()" onclick="usunFormatowanie()">❌</button>
        </div>

        <label>Typ:</label>
        <div class="types-bar">
            <button type="button" class="btn-type btn-karta" onmousedown="event.preventDefault()" onclick="zastosujSchemat('#e74c3c', 'white')">Karta/Blik</button>
            <button type="button" class="btn-type btn-koszt" onmousedown="event.preventDefault()" onclick="zastosujSchemat('#ffaa00', 'black')">koszt</button>
            <button type="button" class="btn-type btn-przychod" onmousedown="event.preventDefault()" onclick="zastosujSchemat('#ffff00', 'black')">przychód</button>
            <button type="button" class="btn-type btn-sklep" onmousedown="event.preventDefault()" onclick="zastosujSchemat('#55ffff', 'black')">Sklep</button>
            <button type="button" class="btn-type btn-opis" onmousedown="event.preventDefault()" onclick="zastosujSchemat('#dddcd8', 'black')">Opis</button>
            <button type="button" class="btn-type btn-zus" onmousedown="event.preventDefault()" onclick="zastosujSchemat('#ffaaff', 'white')">ZUS</button>
        </div>

        <label>Opis:</label>
        <div id="opis" contenteditable="true"></div>

        <button class="btn-primary" onclick="zapiszWpis()">Zapisz wpis</button>
        <button class="btn-secondary" onclick="zamknijFormularzWpisu()">Anuluj</button>
    </div>

    <!-- FORMULARZ NOTATKI -->
    <div id="widok-formularza-notatki" class="view card">
        <h2 id="note-form-title">Nowa notatka</h2>
        <input type="hidden" id="edit-note-index" value="-1">

        <label>Tytuł:</label>
        <input type="text" id="note-title" placeholder="Tytuł lub temat...">

        <label>Treść notatki:</label>
        <textarea id="note-content" rows="6" placeholder="Wpisz treść notatki..."></textarea>

        <label>Zdjęcia (oryginalna rozdzielczość):</label>
        <div class="note-photo-picker">
            <input type="file" id="note-photos-input" accept="image/*" multiple onchange="dodajZdjeciaDoFormularza(event)">
            <div id="note-pending-photos" class="note-pending-list"></div>
        </div>

        <button class="btn-primary" style="background-color: #3498db;" onclick="zapiszNotatke()">Zapisz notatkę</button>
        <button class="btn-secondary" onclick="zamknijFormularzNotatki()">Anuluj</button>
    </div>

    <!-- PEŁNOEKRANOWY PODGLĄD ZDJĘĆ NOTATKI -->
    <div id="note-photo-lightbox" class="photo-lightbox" role="dialog" aria-modal="true">
        <div class="photo-lightbox-top">
            <span id="lightbox-counter">1 / 1</span>
            <span id="lightbox-filename"></span>
            <button type="button" class="photo-lightbox-close" onclick="zamknijPodgladZdjec()">✕ Zamknij</button>
        </div>
        <div id="lightbox-stage" class="photo-lightbox-stage">
            <img id="lightbox-img" alt="Podgląd zdjęcia">
        </div>
        <div class="photo-lightbox-nav">
            <button type="button" id="lightbox-prev" onclick="przelaczZdjecieLightbox(-1)">❮ Poprzednie</button>
            <button type="button" id="lightbox-next" onclick="przelaczZdjecieLightbox(1)">Następne ❯</button>
        </div>
    </div>

    <!-- Stopka -->
    <footer style="text-align: center; margin-top: 20px; margin-bottom: 10px; color: #888; font-size: 0.8rem;">
        Web-asystent <span id="app-version"></span>
    </footer>

    <script src="app.js"></script>
</body>
</html>
